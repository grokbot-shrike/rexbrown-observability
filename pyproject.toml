[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rexbrown-observability"
version = "0.1.0"
description = "Structured JSON logging, request IDs, health endpoint and optional Sentry/GlitchTip wiring for Rex Brown Python services."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Rex Brown Ltd" }]
dependencies = []

[project.optional-dependencies]
fastapi = ["starlette>=0.27"]
sentry = ["sentry-sdk>=2"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "sentry-sdk>=2"]

[tool.hatch.build.targets.wheel]
packages = ["src/rexbrown_observability"]

[tool.pytest.ini_options]
testpaths = ["tests"]
